# DocuMind-AI deployment: three services, one command (`docker compose up --build`).
#
# The LLM runs in Ollama on the host by default (models are already downloaded
# there). On a machine without Ollama, add the bundled one:
#   docker compose --profile ollama up --build
# and set COMPOSE_OLLAMA_HOST=ollama in .env.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # The postgres image has its own variable names; values come from DB_*.
      POSTGRES_USER: ${DB_USER:-documind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-documind}
      POSTGRES_DB: ${DB_NAME:-documind}
    ports:
      # Published on loopback only, for the backend running in a local venv.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./app/backend
    environment:
      # Inside the compose network the database is always db:5432.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-documind}
      DB_USER: ${DB_USER:-documind}
      DB_PASSWORD: ${DB_PASSWORD:-documind}
      HTTP_OLLAMA_HOST: ${COMPOSE_OLLAMA_HOST:-host.docker.internal}
      HTTP_OLLAMA_PORT: ${HTTP_OLLAMA_PORT:-11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:32b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_CONTEXT_LIMIT: ${LLM_CONTEXT_LIMIT:-10000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  uploads:
  ollama:
