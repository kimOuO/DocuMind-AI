# DocuMind-AI deployment: three services, one command (`docker compose up --build`).
#
# The LLM runs in Ollama on the host by default (models are already downloaded
# there). On a machine without Ollama, add the bundled one:
#   docker compose --profile ollama up --build
# and set OLLAMA_BASE_URL=http://ollama:11434 in .env.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-documind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind}
      POSTGRES_DB: ${POSTGRES_DB:-documind}
    ports:
      # Published on loopback only, for the backend running in a local venv.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-documind}:${POSTGRES_PASSWORD:-documind}@db:5432/${POSTGRES_DB:-documind}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:32b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_CONTEXT_LIMIT: ${LLM_CONTEXT_LIMIT:-10000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  uploads:
  ollama:
