repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Vendored third-party files must stay byte-identical to their source,
      # so the two hooks that rewrite files skip them.
      - id: trailing-whitespace
        exclude: (\.md$|^app/backend/third-party/)
      - id: end-of-file-fixer
        exclude: ^app/backend/third-party/
      - id: check-yaml
      - id: check-json
        # tsconfig files are JSON-with-comments.
        exclude: tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=4096]
        # The only exception: the vendored tokenizers (Qwen3 11.4 MB, Qwen3.6 12.8 MB).
        exclude: ^app/backend/third-party/[^/]+/tokenizer\.json$
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (backend)
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types: [python]
